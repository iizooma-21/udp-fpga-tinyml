# Timeloop: R=S=1 (pure channel mixing)
# =============================================================================

problem:
  R: 1
  S: 1
  P: 12
  Q: 12
  C: 32
  K: 64
  N: 1
  Wstride: 1
  Hstride: 1
  Wdilation: 1
  Hdilation: 1
