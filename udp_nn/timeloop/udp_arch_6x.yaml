# =============================================================================
# udp_arch_6x.yaml — Hypothetical 6× scaled UDP systolic array (1 MAC/cycle)
# =============================================================================
#
# Purpose:
#   Comparison baseline for the 6-MAC-per-PE (udp_arch_6mac.yaml) experiment.
#   This keeps the original 1-MAC/cycle dataflow but simply gives the array
#   6× more PEs (144 → 864).  Both arrays thus have identical total compute
#   throughput in MACs/cycle, so any utilization difference between the two
#   models is attributable purely to the modelling approach, not to capacity.
#
# Differences from udp_arch.yaml
# --------------------------------
#   MACs            : 144  → 864  (meshX still 12, meshY 12 → 72)
#   PsumRegFile     : 144  → 864
#   WeightRegFile   : 144  → 864
#   InputRegFile    : 144  → 864
#   DummyBuffer     : 12   → 72   (one shim row per group of 12 PEs)
#   Everything else : unchanged
#
# Effective throughput:
#   reported_compute × 1  (no correction factor needed; just 864 1-MAC PEs)
#   For fair comparison with the UDP hardware divide reported cycles by 6 as
#   usual, since the 864-PE array has the same silicon budget as 144 PEs × 6.
# =============================================================================

mapper:
  algorithm: linear-pruned
  optimization-metrics:
  - delay
  - energy
  victory-condition: 100
  timeout: 2000
  num-threads: 4

arch:
  # ── Compute: 864 PEs on a 12-wide spatial mesh (12 cols × 72 rows) ──────────
  arithmetic:
    name: MACs
    instances: 864
    meshX: 12
    word-bits: 4

  storage:
  # ── L0 partial sums (per PE, 12-bit accumulators) ───────────────────────────
  - name: PsumRegFile
    instances: 864
    meshX: 12
    entries: 16
    word-bits: 12
    read_bandwidth: 2
    write_bandwidth: 2

  # ── L1 weights (stationary in WS dataflow) ──────────────────────────────────
  - name: WeightRegFile
    instances: 864
    meshX: 12
    entries: 192
    word-bits: 4
    read_bandwidth: 2
    write_bandwidth: 2

  # ── L1 activations (stream through systolic rows) ───────────────────────────
  - name: InputRegFile
    instances: 864
    meshX: 12
    entries: 12
    word-bits: 4
    read_bandwidth: 2
    write_bandwidth: 2

  # ── Mapping shim (6 rows × 12 cols = 72 shim instances) ─────────────────────
  - name: DummyBuffer
    instances: 72
    meshX: 12
    entries: 0
    word-bits: 4

  # ── Shared on-chip buffer ────────────────────────────────────────────────────
  - name: GlobalBuffer
    instances: 1
    meshX: 1
    sizeKB: 256
    word-bits: 4
    block-size: 4
    read_bandwidth: 16
    write_bandwidth: 16

  # ── Off-chip memory ──────────────────────────────────────────────────────────
  - name: DRAM
    technology: DRAM
    instances: 1
    word-bits: 4

mapspace:
  constraints:
  # ── Weight-stationary datatype bypass ───────────────────────────────────────
  - target: PsumRegFile
    type: datatype
    keep:
    - Outputs
    bypass:
    - Weights
    - Inputs

  - target: WeightRegFile
    type: datatype
    keep:
    - Weights
    bypass:
    - Inputs
    - Outputs

  - target: InputRegFile
    type: datatype
    keep:
    - Inputs
    bypass:
    - Weights
    - Outputs

  - target: DummyBuffer
    type: datatype
    bypass:
    - Inputs
    - Outputs
    - Weights

  - target: GlobalBuffer
    type: datatype
    keep:
    - Inputs
    - Outputs
    bypass:
    - Weights

  # ── Spatial mapping ──────────────────────────────────────────────────────────
  # DummyBuffer now has 72 instances (12 cols × 6 rows); the mapper can use
  # a larger spatial tile in the row direction (S×C×K can combine up to 72).
  - target: DummyBuffer
    type: spatial
    split: 4
    factors: N1 P1 Q1 R1 S0
    permutation: NPQR SCK

  - target: GlobalBuffer
    type: spatial
    split: 7
    factors: N1 C1 P1 R1 S1
    permutation: NCPRS QK

  # ── Temporal loop ordering (same WS schedule as original) ───────────────────
  - target: PsumRegFile
    type: temporal
    factors: N1 C1 P1 Q1 R1 S1
    permutation: NCPQRS K

  - target: WeightRegFile
    type: temporal
    factors: N1 K1 P1 Q1 S1 R0
    permutation: NKPQS CR

  - target: InputRegFile
    type: temporal
    factors: N1 K1 C1 P1 Q1 R1 S1
    permutation: NKCPQRS

  - target: DummyBuffer
    type: temporal
    factors: N1 K1 C1 P1 Q1 R1 S1
    permutation: NKCPQRS

  - target: GlobalBuffer
    type: temporal
    factors: Q1 R1 S1 C1 P0
    permutation: QRSC PNK

  - target: DRAM
    type: temporal
    factors: R1 S1 P1
    permutation: RSP CKNQ
